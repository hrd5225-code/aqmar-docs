<style>
:root{--bg:#F3F5FA;--card:#fff;--ink:#1B2440;--mut:#5B6478;--line:#D3D9E6;--soft:#E8ECF4;--navy:#1F4E79;--nt:#1F4E79;--red:#B3261E;--redb:#FDECEA;--out:#E9EDF5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162B;--card:#1A2240;--ink:#E8ECF8;--mut:#9AA5C2;--line:#33406A;--soft:#2A3558;--nt:#9DBBE6;--redb:#3A1D22;--red:#FF8A80;--out:#0A0F20}}
:root[data-theme="dark"]{--bg:#10162B;--card:#1A2240;--ink:#E8ECF8;--mut:#9AA5C2;--line:#33406A;--soft:#2A3558;--nt:#9DBBE6;--redb:#3A1D22;--red:#FF8A80;--out:#0A0F20}
html,body{margin:0;min-height:100%}
body{background:var(--out);font-family:'Cairo',Tahoma,sans-serif;color:var(--ink)}
#app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;flex:1}header small{display:block;font-size:12px;color:var(--mut);font-weight:400}
main{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}
button,input,textarea,select{font-family:inherit}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px;color:var(--nt)}
.row{display:flex;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0}
label.f small{font-weight:400;color:var(--mut);font-size:11px;margin-top:-3px}
input,textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--card);color:var(--ink);min-height:46px}
textarea{resize:vertical}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:0 14px;flex:1}
.btn.o{background:transparent;border:1.5px solid var(--nt);color:var(--nt)}
.btn.g{background:#1B6B49}
.ib{width:46px;height:46px;border:0;border-radius:12px;background:var(--soft);color:var(--nt);cursor:pointer;font-size:13px;font-family:inherit;flex-shrink:0}
.ib.d{background:var(--redb);color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--ink);font-size:14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.it{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sigb{flex:1;min-height:84px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card);color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:4px}
.sigb img{max-width:100%;max-height:56px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;box-sizing:border-box;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.over{position:fixed;inset:0;background:rgba(10,15,32,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet h2{margin:0;text-align:center;font-size:18px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}.hr .m{font-size:12px;color:var(--mut)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1B2440;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:90%;text-align:center}
/* ====== A4 page (identical to the Excel layout) ====== */
#pvw{direction:ltr;overflow:hidden;padding:0}
.pg{width:794px;height:1123px;position:relative;background:#fff;font-family:Arial,'Liberation Sans',Helvetica,sans-serif;color:#1F2933;overflow:hidden;direction:ltr;box-sizing:border-box;text-align:left}
.pg .in{position:absolute;left:47px;top:30px;width:700px}
.pg .ar{font-family:'Cairo',Tahoma,sans-serif;color:#073763;font-weight:700}
.pg table{border-collapse:collapse;table-layout:fixed;width:700px;border:2px solid #1F4E79}
.pg td{border:1px solid #1F4E79;padding:0 6px;overflow:hidden;vertical-align:middle}
.pg .hh td{background:#EAF2F8;color:#0B2A53;font-weight:700;text-align:center}
.pg .lb,.pg .vl{font-size:13px;text-align:left;word-break:break-word}
.pg .ship{font-size:18px;text-align:left;white-space:pre-wrap;word-break:break-word}
.pg .c{text-align:center;font-size:14px;color:#111827}.pg .l{text-align:left;font-size:14px;color:#111827;word-break:break-word}
.pg .at{border-collapse:collapse;table-layout:fixed;width:700px;border:1.5px solid #5F6B70}
.pg .at td{border:1px solid #8B969A;padding:0 4px;text-align:center;font-size:12px;color:#2D3436;overflow:hidden;word-break:break-word;line-height:1.15;vertical-align:middle}
.pg .at .tt td{background:#F7F9FA;font-weight:700;font-size:18px}
.pg .at .lbl{background:#F4F7F8;font-weight:700;font-size:13px;text-align:left;padding-left:6px}
.pg .at .hd td{background:#EFF4F5;font-weight:700;font-size:11.5px;border-color:#5F6B70}
.pg .at .sn{font-weight:700}
@page{size:A4;margin:0}
@media print{body *{visibility:hidden}#pgs,#pgs *{visibility:visible}#pgs{position:fixed!important;left:0;top:0;transform:none!important;width:794px;height:1123px}}
</style>

const aopen=i=>{AO=AO===i?-1:i;R()};
function aadd(c){const L=AS.rows;if(L.length+c>30){toast('الحد الأقصى 30 صفًا في الصفحة');return}for(let j=0;j<c;j++){const p=L[L.length-1],k=p?parseInt(p.no):0;L.push({...blankRow(AS.def),no:((isNaN(k)?L.length:k)+1)+'-'})}persist();R()}
function adel(i){if(AS.rows.length<2){toast('يجب بقاء صف واحد على الأقل');return}AS.rows.splice(i,1);AO=-1;persist();R()}
function aapply(){const d=AS.def;AS.rows.forEach(r=>{r.color=d.color;r.gas=d.gas;r.mat=d.mat;r.app=d.app});persist();R();toast('تم تطبيق القيم على كل الصفوف')}
const aclrSig=()=>{AS.sig={pre:'',chk:'',app:''};persist();R()};
function setDoc(d){DOC=d;try{localStorage.setItem('dn_doc',d)}catch(e){}tab=0;AO=-1;R();scrollTo(0,0)}
function ashFormV(){const A=AS,d=A.def;
const df=(l,k)=>`<label class="f">${l}<input value="${esc(d[k])}" oninput="adef('${k}',this.value)"></label>`;
const rf=(i,l,k,v)=>`<label class="f">${l}<input value="${esc(v)}" oninput="arow(${i},'${k}',this.value)"></label>`;
const rows=A.rows.map((r,i)=>`<div class="it"><div class="row"><label class="f" style="flex:0 0 56px">No.<input value="${esc(r.no)}" oninput="arow(${i},'no',this.value)"></label><label class="f">MFR<input type="number" inputmode="decimal" value="${esc(r.mfr)}" oninput="arow(${i},'mfr',this.value)"></label><label class="f">Ash<input type="number" inputmode="decimal" value="${esc(r.ash)}" oninput="arow(${i},'ash',this.value)"></label><button class="ib" aria-label="تفاصيل" onclick="aopen(${i})">${AO===i?'▲':'▼'}</button><button class="ib d" aria-label="حذف" onclick="adel(${i})">حذف</button></div>${AO===i?`<div class="row">${rf(i,'Color','color',r.color)}${rf(i,'Gas Content','gas',r.gas)}</div><div class="row">${rf(i,'Material','mat',r.mat)}${rf(i,'Appearance','app',r.app)}</div>`:''}</div>`).join('');
const sg=['pre','chk','app'].map(k=>`<button class="sigb" onclick="sigOpen('${k}')">${A.sig[k]?`<img src="${A.sig[k]}" alt="">`:'اضغط للتوقيع'}<span>${SL()[k]}</span></button>`).join('');
return `<main><section class="card"><h2>Test Information</h2><label class="f">Production Date<small>تاريخ الإنتاج</small><input type="date" value="${esc(A.date)}" oninput="aup('date',this.value)"></label><label class="f">Customer PO number<small>رقم أمر الشراء</small><input value="${esc(A.po)}" oninput="aup('po',this.value)" autocomplete="off"></label></section>
<section class="card"><h2>القيم الافتراضية للعينات</h2>${df('Color','color')}${df('Gas Content','gas')}${df('Material','mat')}${df('Appearance','app')}<button class="btn o" onclick="aapply()">تطبيق على كل الصفوف</button></section>
<section class="card"><h2>Samples (${A.rows.length})</h2>${rows}<div class="row" style="align-items:stretch"><button class="btn o" onclick="aadd(1)">+ صف</button><button class="btn o" onclick="aadd(5)">+ 5 صفوف</button></div><div id="astat" style="font-size:13px;color:var(--mut)"></div></section>
<section class="card"><h2>التوقيعات (اختياري)</h2><div class="row" style="align-items:stretch">${sg}</div>${['pre','chk','app'].some(k=>A.sig[k])?'<button class="btn o" onclick="aclrSig()">مسح كل التوقيعات</button>':''}</section></main>
<div class="bar"><button class="btn o" onclick="saveH(1)">حفظ في السجل</button><button class="btn" onclick="tab=1;R();scrollTo(0,0)">معاينة وإرسال</button></div>`}
function R(){const dn=DOC==='dn';$('app').innerHTML=`<header><div style="flex:1"><h1>${dn?'سند التسليم':'اختبار نسبة الرماد'} <small>${dn?'Delivery Note <span id="hn">#'+esc(N.no)+'</span>':'Ash Content Test'}</small></h1></div><button class="ib" onclick="histV()">السجل</button></header><div style="padding:10px 12px 0;display:flex;flex-direction:column;gap:8px"><div class="seg"><button class="${dn?'on':''}" onclick="setDoc('dn')">سند التسليم</button><button class="${dn?'':'on'}" onclick="setDoc('ash')">اختبار الرماد</button></div><div class="seg"><button class="${tab?'':'on'}" onclick="tab=0;R()">تعبئة البيانات</button><button class="${tab?'on':''}" onclick="tab=1;R();scrollTo(0,0)">معاينة / PDF</button></div></div>`+(tab?prevV():(dn?formV():ashFormV()));if(tab)fit();else if(!dn)astat()}
addEventListener('resize',fit);
R();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
</body>
</html>
